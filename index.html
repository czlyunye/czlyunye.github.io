<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云野 Yunye · 个人主页</title>
  <meta name="description" content="云野（陈照梁）的个人网站——摄影、研究与联系。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title-key="doc.title.index">

  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html">云野<span>Yunye</span></a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home"></a></li>
        <li><a href="photography.html" data-i18n="nav.photography"></a></li>
        <li><a href="blog.html" data-i18n="nav.blog"></a></li>
        <li><a href="contact.html" data-i18n="nav.contact"></a></li>
      </ul>
      <button class="lang-toggle" type="button"><span class="zh on">中</span><span class="sep">/</span><span class="en">EN</span></button>
    </nav>
  </header>

  <main>
    <!-- Hero -->
    <section class="container">
      <div class="hero">
        <div>
          <div class="hero-eyebrow" data-i18n="hero.eyebrow"></div>
          <h1><span data-i18n="hero.name"></span><span class="latin" data-i18n="hero.name.latin"></span></h1>
          <blockquote class="hero-poem">
            <span data-i18n="hero.poem"></span>
            <cite data-i18n="hero.poem.src"></cite>
          </blockquote>
          <p class="hero-bio" data-i18n="hero.bio"></p>
          <div class="hero-cta">
            <a class="btn btn-solid" href="photography.html" data-i18n="hero.cta.gallery"></a>
            <a class="btn btn-ghost" href="contact.html" data-i18n="hero.cta.contact"></a>
          </div>
        </div>
        <div class="hero-avatar">
          <img src="images/avatar.jpg" alt="云野 Yunye">
        </div>
      </div>
    </section>

    <!-- 关于我 -->
    <section class="section">
      <div class="container">
        <h2 class="section-title"><span data-i18n="sec.about"></span><span class="en" data-i18n="sec.about.en"></span></h2>
        <div class="prose">
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <p data-i18n="about.p3"></p>
        </div>
      </div>
    </section>

    <!-- 教育经历 -->
    <section class="section">
      <div class="container">
        <h2 class="section-title"><span data-i18n="sec.edu"></span><span class="en" data-i18n="sec.edu.en"></span></h2>
        <div class="edu-item">
          <div class="edu-time">2022.9 – 2026.6</div>
          <div>
            <div class="edu-name" data-i18n="edu.1.name"></div>
            <div class="edu-note" data-i18n="edu.1.mentor"></div>
            <div class="edu-note" data-i18n="edu.1.note"></div>
          </div>
        </div>
        <div class="edu-item">
          <div class="edu-time">2019.9 – 2022.6</div>
          <div>
            <div class="edu-name" data-i18n="edu.2.name"></div>
            <div class="edu-note" data-i18n="edu.2.note"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 研究兴趣 -->
    <section class="section">
      <div class="container">
        <h2 class="section-title"><span data-i18n="sec.interests"></span><span class="en" data-i18n="sec.interests.en"></span></h2>
        <div class="tags">
          <span class="tag" data-i18n="interest.1"></span>
          <span class="tag" data-i18n="interest.2"></span>
          <span class="tag" data-i18n="interest.3"></span>
          <span class="tag" data-i18n="interest.4"></span>
        </div>
      </div>
    </section>

    <!-- 精选摄影 -->
    <section class="section">
      <div class="container">
        <h2 class="section-title"><span data-i18n="sec.featured"></span><span class="en" data-i18n="sec.featured.en"></span></h2>
        <a class="featured-card" href="photography.html"></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>© <span class="footer-year"></span> 云野 Yunye</div>
      <div data-i18n="footer.right"></div>
    </div>
  </footer>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/photos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/lyrics.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/pjax.js"></script>
</body>
</html>
